<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>偶像飯撒大作戰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#ff5fa2; --pink2:#ffb3d1; --purple:#7b5cff; --ink:#2b1d3a; --card:#fff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:"Noto Sans TC",system-ui,sans-serif; color:var(--ink);
    background:
      radial-gradient(circle at 15% 20%, #ffe0ef 0 18%, transparent 19%),
      radial-gradient(circle at 85% 80%, #e4dcff 0 22%, transparent 23%),
      linear-gradient(160deg,#fff0f7,#efe9ff);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .wrap{width:100%;max-width:380px;text-align:center}
  h1{font-weight:900;font-size:26px;margin:0 0 4px;letter-spacing:1px}
  h1 span{color:var(--pink)}
  .sub{font-size:13px;opacity:.7;margin-bottom:16px}

  /* ---- card ---- */
  .card-outer{
    padding:5px;border-radius:22px;
    background:linear-gradient(135deg,#ff8ac2,#ffd36e,#7ce0ff,#b28bff,#ff8ac2);
    background-size:300% 300%; animation:holo 6s linear infinite;
    box-shadow:0 14px 34px rgba(123,92,255,.25);
  }
  @keyframes holo{0%{background-position:0 50%}100%{background-position:300% 50%}}
  .card{background:var(--card);border-radius:18px;overflow:hidden;position:relative}
  .card.flip{animation:flip .55s ease}
  @keyframes flip{0%{transform:rotateY(90deg) scale(.9);opacity:.2}100%{transform:none;opacity:1}}
  .portrait{position:relative;height:310px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
  .portrait svg{width:220px;height:220px;position:relative}
  .portrait .blur{position:absolute;inset:-20px;background-size:cover;background-position:center;filter:blur(18px) saturate(1.2);transform:scale(1.15)}
  .portrait .photo{position:relative;height:100%;width:auto;display:block;-webkit-mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent)}
  .portrait .badge,.portrait .archetype{z-index:2}
  .mini img{width:140px;height:140px;object-fit:cover;object-position:top;border-radius:50%;border:4px solid #ffb3d1}
  .badge{
    position:absolute;top:12px;left:12px;font-size:12px;font-weight:700;color:#fff;
    padding:4px 10px;border-radius:999px;background:var(--purple)
  }
  .archetype{position:absolute;top:12px;right:12px;font-size:12px;font-weight:700;
    background:rgba(255,255,255,.85);padding:4px 10px;border-radius:999px}
  .body{padding:14px 18px 18px}
  .name-input{
    width:100%;font:inherit;font-weight:900;font-size:22px;text-align:center;
    border:none;border-bottom:2px dashed var(--pink2);padding:4px 0 6px;outline:none;color:var(--ink);background:transparent
  }
  .name-input:focus{border-bottom-color:var(--pink)}
  .name-input::placeholder{color:#c9b8d6;font-weight:700}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 12px}
  .stat{background:#faf6ff;border-radius:12px;padding:8px 4px}
  .stat b{display:block;font-size:11px;opacity:.6;font-weight:700;margin-bottom:2px}
  .stat span{font-size:15px;font-weight:900}
  .secret{
    position:relative;border-radius:14px;padding:12px 14px;text-align:left;cursor:pointer;
    background:repeating-linear-gradient(-45deg,#2b1d3a 0 10px,#3a2850 10px 20px);color:#fff;
    user-select:none;
  }
  .secret .label{font-size:12px;font-weight:900;color:#ffd36e;letter-spacing:1px;display:flex;justify-content:space-between}
  .secret .text{font-size:15px;font-weight:700;margin-top:6px;line-height:1.45;filter:blur(7px);transition:filter .35s}
  .secret.open .text{filter:none}
  .secret .hint{position:absolute;inset:auto 0 12px 0;text-align:center;font-size:13px;font-weight:700;color:#ffd36e}
  .secret.open .hint{display:none}
  .risk{font-size:12px;color:#ffd36e}

  .btns{display:flex;gap:10px;margin-top:16px}
  button{
    flex:1;font:inherit;font-weight:900;font-size:16px;border:none;border-radius:14px;padding:13px 0;cursor:pointer;
    transition:transform .08s
  }
  button:active{transform:scale(.96)}
  .reroll{background:#fff;color:var(--purple);box-shadow:inset 0 0 0 2px var(--purple)}
  .debut{background:linear-gradient(90deg,var(--pink),var(--purple));color:#fff;box-shadow:0 6px 16px rgba(255,95,162,.35)}
  .debut:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
  .tip{font-size:12px;opacity:.6;margin-top:8px;min-height:16px}

  /* ---- next screen placeholder ---- */
  .screen{display:none}
  .screen.on{display:block}
  .soon{background:#fff;border-radius:20px;padding:28px 20px;box-shadow:0 14px 34px rgba(123,92,255,.2)}
  .soon h2{margin:10px 0 6px;font-weight:900}
  .soon p{font-size:14px;opacity:.75;line-height:1.6;margin:0 0 16px}
  .mini svg{width:120px;height:120px}

  /* ---- 飯撒現場 ---- */
  #scr-stage{position:fixed;inset:0;z-index:10;background:radial-gradient(ellipse at 50% -10%,#7b3fb0 0%,#2a1446 55%,#120a22 100%);color:#fff}
  #scr-stage.on{display:block}
  .stage{position:relative;max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;overflow:hidden}
  .hud{padding:12px 14px 4px;position:relative;z-index:3}
  .hud-row{display:flex;align-items:center;gap:10px}
  .hud-row img{width:40px;height:40px;border-radius:50%;object-fit:cover;object-position:top;border:2px solid #ff8ac2}
  .hud-name{font-weight:900;font-size:15px;text-align:left;line-height:1.15}
  .hud-name small{display:block;font-weight:700;font-size:11px;opacity:.7}
  .hud-score{margin-left:auto;font-weight:900;font-size:22px;color:#ffd36e;text-shadow:0 0 12px rgba(255,211,110,.5)}
  .hud-score.bump{animation:bump .4s}
  @keyframes bump{50%{transform:scale(1.35)}}
  .tbar{margin-top:10px;height:10px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden;position:relative}
  .tbar i{position:absolute;top:0;bottom:0;left:0;background:linear-gradient(90deg,#ff5fa2,#ffd36e);border-radius:99px}
  .tbar.low i{background:linear-gradient(90deg,#ff3b3b,#ff8a5f)}
  .ttext{font-size:12px;font-weight:700;margin-top:4px;text-align:right;opacity:.85}
  .tbar.low + .ttext{color:#ff8a8a;opacity:1}
  .crowd{flex:1;position:relative;min-height:190px}
  .beam{position:absolute;top:-40px;width:120px;height:110%;background:linear-gradient(rgba(255,230,255,.22),transparent 80%);filter:blur(6px);transform-origin:top center}
  .frow{position:absolute;left:0;right:0;display:flex;justify-content:space-around;align-items:flex-end}
  .frow.back{bottom:72px;opacity:.55;padding:0 4%}
  .frow.front{bottom:-8px;padding:0 1%}
  .fan{position:relative;animation:bob 1.2s ease-in-out infinite;transform-origin:bottom center}
  .frow.back .fan{width:13%}
  .frow.front .fan{width:19%}
  .fan svg{width:100%;display:block}
  .fan .eL{display:none}
  .fan.love .eL{display:inline}
  .fan.love .eN{display:none}
  .fan.faint{animation:faint 1.8s ease forwards}
  @keyframes bob{50%{transform:translateY(-6px)}}
  @keyframes faint{0%{transform:rotate(0)}25%{transform:rotate(-12deg) translateY(-8px)}60%,85%{transform:rotate(-38deg) translateY(14px)}100%{transform:rotate(0)}}
  .fan .sign{position:absolute;left:50%;top:50%;transform:translateX(-50%) rotate(-4deg);background:#fff36e;color:#2b1d3a;font-size:11px;font-weight:900;padding:3px 6px;border-radius:5px;white-space:nowrap;box-shadow:0 2px 0 #c9b22e;z-index:2}
  .fan.target{cursor:pointer}
  .fan.target::after{content:'';position:absolute;left:4%;right:4%;top:10%;height:44%;border-radius:50%;box-shadow:0 0 0 3px #ffd36e,0 0 18px #ffd36e;animation:pulse .6s infinite alternate;pointer-events:none}
  @keyframes pulse{to{opacity:.35}}
  .panel{position:relative;z-index:4;background:#fff;color:var(--ink);border-radius:22px 22px 0 0;padding:14px 16px 18px;min-height:300px;box-shadow:0 -10px 30px rgba(0,0,0,.3);text-align:center}
  .ptitle{display:flex;align-items:center;gap:8px;font-weight:900;font-size:18px;text-align:left}
  .ptitle .bonus{margin-left:auto;font-size:12px;background:linear-gradient(90deg,var(--pink),var(--purple));color:#fff;padding:4px 9px;border-radius:99px;white-space:nowrap}
  .pbar{height:7px;background:#f0e8f7;border-radius:99px;margin:8px 0 10px;overflow:hidden}
  .pbar i{display:block;height:100%;width:100%;background:var(--purple);border-radius:99px}
  .hint{font-size:13px;opacity:.75;margin-bottom:10px;font-weight:700;line-height:1.5}
  canvas.sig{width:100%;height:150px;background:#fff;border-radius:14px;box-shadow:inset 0 0 0 2px #eadcf5;touch-action:none;display:block;cursor:crosshair}
  .prow{display:flex;gap:10px;margin-top:10px}
  .go{background:linear-gradient(90deg,var(--pink),var(--purple));color:#fff}
  .ghost{background:#f4effa;color:var(--purple)}
  .go:disabled{opacity:.4;cursor:not-allowed}
  .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .opts.four{grid-template-columns:repeat(2,1fr)}
  button.opt{background:#faf6ff;border-radius:16px;padding:12px 4px;font-size:13px;font-weight:900;color:var(--ink);box-shadow:inset 0 0 0 2px #eadcf5}
  .opt .em{display:block;font-size:36px;margin-bottom:6px;line-height:1.1}
  .opt small{display:block;color:var(--pink);font-size:12px;margin-top:3px}
  button.kissbtn{display:block;flex:none;margin:6px auto;width:150px;height:150px;border-radius:50%;font-size:64px;padding:0;background:radial-gradient(circle,#ffe3f0,#ff8ac2);box-shadow:0 0 0 8px rgba(255,138,194,.25);animation:pulse2 .6s infinite alternate}
  @keyframes pulse2{to{transform:scale(1.07)}}
  .selfie{display:flex;gap:14px;align-items:center}
  .phone{width:150px;height:200px;border-radius:22px;background:#111;padding:8px;flex:none;position:relative}
  .screenv{width:100%;height:100%;border-radius:15px;overflow:hidden;position:relative;background:#2a1446}
  .scene{position:absolute;inset:-30%;display:flex;align-items:center;justify-content:center;gap:2px;background:radial-gradient(circle at 50% 45%,#9b5fd0,#2a1446 60%)}
  .scene img{width:70px;height:70px;border-radius:50%;object-fit:cover;object-position:top;border:3px solid #fff}
  .scene .fe{font-size:28px}
  .level{position:absolute;left:8%;right:8%;top:50%;border-top:2px dashed rgba(255,255,255,.75)}
  .level.ok{border-top:3px solid #6dffb0}
  .grid3{position:absolute;inset:0;background:linear-gradient(90deg,transparent 33%,rgba(255,255,255,.18) 33.3%,transparent 33.7%,transparent 66.3%,rgba(255,255,255,.18) 66.6%,transparent 67%)}
  .sctl{flex:1;text-align:left}
  .sctl input[type=range]{width:100%;accent-color:#7b5cff;height:28px}
  .angle{font-size:14px;font-weight:900;margin:4px 0 10px}
  .flash{position:absolute;inset:0;background:#fff;animation:flash .5s forwards;pointer-events:none}
  @keyframes flash{to{opacity:0}}
  .pop{position:absolute;z-index:6;font-weight:900;pointer-events:none;animation:popup 1.15s ease forwards;white-space:nowrap;text-align:center;text-shadow:0 2px 10px rgba(0,0,0,.45);line-height:1.2}
  @keyframes popup{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}80%{opacity:1;transform:translate(-50%,-80%) scale(1)}100%{opacity:0;transform:translate(-50%,-110%) scale(1)}}
  .floatheart{position:absolute;z-index:5;pointer-events:none;animation:fh 1.6s ease-out forwards}
  @keyframes fh{to{transform:translate(var(--dx),-180px) scale(1.4);opacity:0}}
  .overlay{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;font-size:60px;font-weight:900;background:rgba(18,10,34,.6);text-shadow:0 0 24px #ff5fa2}
  .overlay span{animation:cnt .8s ease}
  @keyframes cnt{0%{transform:scale(2);opacity:0}30%{transform:scale(1);opacity:1}}
  .gesture{position:absolute;left:50%;top:42%;font-size:100px;z-index:6;pointer-events:none;animation:gest 1.1s ease forwards;white-space:nowrap}
  @keyframes gest{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15);opacity:1}75%{opacity:1}100%{transform:translate(-50%,-60%) scale(1);opacity:0}}

  /* ---- 秘密危機 ---- */
  .panel.alert{box-shadow:0 -10px 30px rgba(255,59,59,.55),inset 0 0 0 3px #ff3b3b}
  .crisis-scene{background:#2b1d3a;color:#fff;border-radius:14px;padding:10px 12px;font-size:14px;font-weight:700;line-height:1.55;text-align:left;margin-bottom:10px}
  .copts{display:flex;flex-direction:column;gap:8px}
  .copts button{flex:none;font-size:14px;padding:11px 12px;text-align:left;background:#faf6ff;color:var(--ink);box-shadow:inset 0 0 0 2px #eadcf5;border-radius:12px;font-weight:700;line-height:1.4}
  button.mash{width:100%;padding:14px;background:linear-gradient(90deg,#ff3b3b,#ff8a5f);color:#fff;font-size:17px;touch-action:manipulation;user-select:none;transition:transform .05s}
  .mash .em{font-size:40px;display:block}
  .mash .cnt{font-size:14px;opacity:.9;margin-top:4px}
  .catchme{position:absolute;z-index:7;font-size:42px;cursor:pointer;animation:drift 1.2s ease-in-out infinite alternate;filter:drop-shadow(0 0 8px #ff3b3b);user-select:none;touch-action:manipulation}
  @keyframes drift{to{transform:translate(var(--mx),var(--my)) rotate(20deg)}}
  .stage.shake{animation:shake .35s infinite}
  @keyframes shake{25%{transform:translate(2px,-1px)}50%{transform:translate(-2px,1px)}75%{transform:translate(1px,2px)}}
  .reddim{position:absolute;inset:0;z-index:3;pointer-events:none;box-shadow:inset 0 0 90px 20px rgba(255,30,60,.55);animation:redp .6s infinite alternate}
  @keyframes redp{to{opacity:.45}}
  .breaking{position:absolute;left:0;right:0;top:92px;z-index:7;background:#e0102e;color:#fff;font-size:13px;font-weight:900;padding:6px 0;overflow:hidden;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.4)}
  .breaking span{display:inline-block;padding-left:100%;animation:ticker 7s linear infinite}
  @keyframes ticker{to{transform:translateX(-100%)}}
  .pflash{position:absolute;z-index:6;width:130px;height:130px;margin:-65px 0 0 -65px;pointer-events:none;border-radius:50%;background:radial-gradient(circle,#fff 0 12%,rgba(255,255,255,.75) 25%,transparent 65%);animation:pfl .42s ease-out forwards;display:flex;align-items:center;justify-content:center}
  .pflash span{font-size:26px;filter:drop-shadow(0 0 4px #000)}
  @keyframes pfl{0%{opacity:0;transform:scale(.4)}15%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:scale(1)}}
  .opt:disabled{opacity:.35;cursor:not-allowed}
  .tiltnote{font-size:13px;font-weight:900;color:var(--purple);margin:6px 0 10px}

  /* ---- 三排觀眾 / 路人 / 黑粉 ---- */
  .frow.back{bottom:150px;opacity:.62;padding:0 3%}
  .frow.mid{bottom:72px;opacity:.82;padding:0 6%}
  .frow.back .fan{width:11%}
  .frow.mid .fan{width:15%}
  .lightsea{position:absolute;left:0;right:0;bottom:175px;height:70px;opacity:.55;background-image:radial-gradient(circle,#ff8ac2 0 2px,transparent 3px),radial-gradient(circle,#7ce0ff 0 2px,transparent 3px),radial-gradient(circle,#ffd36e 0 1.5px,transparent 2.5px);background-size:17px 13px,23px 17px,13px 19px;background-position:0 0,8px 5px,4px 9px;animation:twinkle 1.1s ease-in-out infinite alternate}
  @keyframes twinkle{to{opacity:.25}}
  .banner{position:absolute;left:50%;top:10px;transform:translateX(-50%) rotate(-2deg);background:linear-gradient(90deg,#ff5fa2,#b28bff);color:#fff;font-size:12px;font-weight:900;padding:5px 14px;border-radius:6px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.35)}
  .fan .pDown,.fan .eB,.fan .eA,.fan .mF,.fan .mS{display:none}
  .fan.passer .pUp,.fan.passer .eN,.fan.passer .mN{display:none}
  .fan.passer .pDown,.fan.passer .eB,.fan.passer .mF{display:inline}
  .fan.passer{animation:none}
  .fan.love .eB,.fan.love .eA,.fan.love .mF{display:none}
  .fan.love .mN{display:inline}
  .fan.anti .eN,.fan.anti .mN,.fan.anti .eL{display:none}
  .fan.anti .eA,.fan.anti .mS{display:inline}
  .fan.anti{animation:shake .2s infinite}
  .fan.target{cursor:pointer}
  .fan.target::after{display:none}
  .fan.target:hover{filter:brightness(1.25) drop-shadow(0 0 6px #ffd36e)}
  .fan .sign i{font-style:normal;font-size:.85em;margin-left:2px}
  .fan .sign.bad{background:#2b1d3a;color:#ff6b6b;box-shadow:0 2px 0 #000}
  .frow.back .sign{font-size:8px;padding:2px 3px}
  .frow.mid .sign{font-size:9.5px}
  .tomato{position:absolute;z-index:9;font-size:30px;pointer-events:none;animation:toss .5s ease-in forwards}
  @keyframes toss{to{left:50%;top:85%;font-size:90px;transform:translate(-50%,-50%) rotate(540deg)}}
  .splat{position:absolute;inset:0;z-index:9;pointer-events:none;display:flex;align-items:center;justify-content:center}
  .splat span{font-size:160px;filter:drop-shadow(0 0 0 #e33) blur(.3px);animation:splat 1.3s ease forwards}
  @keyframes splat{0%{transform:scale(1.6) rotate(-10deg);opacity:1}60%{opacity:.9}100%{transform:scale(1.3) translateY(60px) rotate(-10deg);opacity:0}}
  .stage.chaos{animation:shake .12s infinite}
  .stage.chaos .fan{animation:run .45s ease-in-out infinite alternate!important}
  @keyframes run{to{transform:translate(var(--cx),-12px) rotate(var(--cr))}}
  /* ---- 節奏比心 ---- */
  .track{position:relative;height:66px;border-radius:16px;background:linear-gradient(90deg,#fff0f7,#f1eaff);overflow:hidden;box-shadow:inset 0 0 0 2px #eadcf5;margin-bottom:10px}
  .track .zone{position:absolute;left:18%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;border:3px dashed var(--pink);box-shadow:0 0 14px rgba(255,95,162,.45)}
  .note{position:absolute;left:-22px;top:50%;margin-top:-22px;width:44px;height:44px;font-size:28px;line-height:44px;text-align:center;will-change:transform;white-space:nowrap}
  .note.hit{animation:nhit .35s forwards}
  @keyframes nhit{to{opacity:0;font-size:56px}}
  .note.miss{opacity:.25!important;filter:grayscale(1)}
  .judge{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-weight:900;font-size:18px;opacity:0}
  .judge.show{animation:jshow .6s}
  @keyframes jshow{0%{opacity:0;transform:translateY(-50%) scale(1.6)}20%{opacity:1;transform:translateY(-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
  .judge.pf{color:var(--pink)} .judge.gd{color:var(--purple)} .judge.miss{color:#999}
  button.hitbtn{width:100%;flex:none;font-size:20px;padding:18px 0;touch-action:manipulation;user-select:none}
  /* ---- 蓄力飛吻 ---- */
  .meter{position:relative;height:18px;border-radius:99px;background:#f0e8f7;overflow:hidden;margin:2px 0 4px}
  .meter .sweet{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(-45deg,#ff8ac2 0 6px,#ffb3d1 6px 12px);opacity:.75}
  .meter i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#b28bff,#7b5cff);border-radius:99px;box-shadow:0 0 8px #7b5cff}
  .meter i.in{background:linear-gradient(90deg,#ff5fa2,#ff2d6f);box-shadow:0 0 10px #ff2d6f}
  .kq{font-size:13px;font-weight:900;color:var(--pink);min-height:18px}
  button.kissbtn{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  button.kissbtn.charging{animation:charge .12s infinite alternate;box-shadow:0 0 0 14px rgba(255,45,111,.35),0 0 40px #ff5fa2}
  @keyframes charge{to{transform:scale(1.12) rotate(3deg)}}
  /* ---- 狂點條 ---- */
  .mbar{position:relative;height:10px;border-radius:99px;background:rgba(255,255,255,.3);margin-top:8px;overflow:visible}
  .mbar i{position:absolute;left:0;top:0;bottom:0;width:0;background:#fff;border-radius:99px;opacity:.6}
  .mbar i.ok{background:#ffd36e;opacity:1}
  .mbar .mmin{position:absolute;top:-4px;bottom:-4px;width:3px;background:#2b1d3a;border-radius:2px}
  .mash .cnt b{font-size:22px}

  /* ---- 結算 ---- */
  .result .rname{font-weight:900;font-size:22px;margin-top:8px}
  .rtier{display:inline-block;margin-top:6px;background:linear-gradient(90deg,var(--pink),var(--purple));color:#fff;font-weight:900;padding:5px 14px;border-radius:99px}
  .rsub{font-size:13px;opacity:.7;margin-top:6px}
  .total{font-size:44px;font-weight:900;color:var(--pink);margin:12px 0 4px}

/* ========== 半寫實頭像產生器（SVG） ========== */
let UID=0;
function tone(hex,amt){ // amt -1..1 變暗/變亮
  const n=parseInt(hex.slice(1),16); let r=n>>16,g=n>>8&255,b=n&255;
  const f=v=>Math.round(amt<0? v*(1+amt) : v+(255-v)*amt);
  return '#'+[f(r),f(g),f(b)].map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0')).join('');
}

function loop(now){
  if(!G||!G.running) return;
  const dt=(now-G.last)/1000; G.last=now; G.t-=dt; updateTimer();
  if(G.act && !G.act.done){
    const el=(now-G.act.start)/1000, bar=$('pbarI');
    if(bar) bar.style.width=Math.max(0,1-el/G.act.limit)*100+'%';
    if(el>=G.act.limit){ G.act.done=true; G.act.onTimeout(); }
  }
  if(G.t<=0){ endStage(); return; }
  requestAnimationFrame(loop);
}
function nextAction(){
  if(!G.running) return;
  const el=ROUND-G.t, nextC=G.crisisPlan[G.crisisIdx];
  if(nextC && !G.forced && el>=nextC[0]) return runCrisis(nextC[1]);
  let key=G.forced; G.forced=null;
  if(!key && G.heartCount===0 && el>=24) key='heart';           // 保證至少比心一次
  if(!key){
    const w=k=> k==='heart' && G.heartCount>=G.heartMax ? 0 : ACTIONS[k].w;
    const ks=Object.keys(ACTIONS), tot=ks.reduce((a,k)=>a+w(k),0); let r=Math.random()*tot;
    key=ks.find(k=>(r-=w(k))<0)||'sign';
  }
  if(key==='heart') G.heartCount++;
  const bp=(G.bonus&&G.bonus.key===key)?G.bonus.pct:0;
  RUN[key](ACTIONS[key],bp);
}
// perf 0~1：表現越好，分數越靠近區間上限（保留一點隨機）
function award(key,perf,anchor,note){
  G.act.done=true;
  const A=ACTIONS[key];
  let pts=A.lo+Math.round((A.hi-A.lo)*clamp(perf*0.85+Math.random()*0.15)), extra='';
  if(G.bonus && G.bonus.key===key){ pts+=Math.round(pts*G.bonus.pct/100); extra=`<div style="font-size:14px">飛吻加成 +${G.bonus.pct}%</div>`; }
  G.bonus=null;
  G.score+=pts; G.stats[key][0]++; G.stats[key][1]+=pts; scoreUI();
  pop(`+${pts} 💗${note?`<div style="font-size:14px;color:#fff">${note}</div>`:''}${extra}`,anchor||crowdMid(),34,'#ffd36e');
  hearts(6+Math.round(perf*8)); loveRandom(2);
  later(nextAction,950);
}
function fail(msg){
  G.act.done=true; G.bonus=null;
  pop(`${msg} 💔<div style="font-size:16px">+0</div>`,crowdMid(),20,'#d9d2e6');
  later(nextAction,900);
}

/* --- 簽名範本：記住上一次的簽名，下一次照著描 --- */
const SIG={ghost:null};
function samplePts(strokes,W,H,maxN=160){
  const pts=[]; strokes.forEach(st=>st.forEach(([x,y])=>pts.push([x*W,y*H])));
  if(pts.length<=maxN) return pts;
  const step=pts.length/maxN; return Array.from({length:maxN},(_,i)=>pts[Math.floor(i*step)]);
}
// 雙向平均最近距離（chamfer）→ 0~1 相似度；平均偏差約 W 的 15% 以上就算 0
function sigSimilarity(a,b,W,H){
  const A=samplePts(a,W,H), B=samplePts(b,W,H); if(!A.length||!B.length) return 0;
  const near=(P,Q)=>P.reduce((s,[x,y])=>s+Math.min(...Q.map(([u,v])=>Math.hypot(x-u,y-v))),0)/P.length;
  const d=(near(A,B)+near(B,A))/2;
  return clamp(1-d/(W*0.15));
}

const RUN={
  sign(A,bp){
    const ghost=SIG.ghost; // 上一次的簽名（正規化座標），有的話就淡淡顯示，照著描
    setPanel(`${A.icon} ${A.name}`,`<div class="hint">${ghost?`照著<b>上一次的淺色筆跡</b>描！越像、越快簽完，分數越高`:`粉絲遞上簽名板！${A.limit} 秒內簽下大名（簽越多粉絲越開心）`}</div><canvas class="sig" id="sig"></canvas><div class="prow"><button class="ghost" id="sigClr">重簽</button><button class="go" id="sigOk" disabled>簽好了 ✍️</button></div>`,bp);
    let len=0, drawing=false, lx=0, ly=0, strokes=[], cur=null;
    const cv=$('sig'), dpr=window.devicePixelRatio||1, W=cv.clientWidth, H=cv.clientHeight;
    cv.width=W*dpr; cv.height=H*dpr; const cx=cv.getContext('2d'); cx.scale(dpr,dpr);
    const paper=()=>{ cx.clearRect(0,0,W,H); cx.fillStyle='#c9b8d6'; cx.font='700 13px "Noto Sans TC",sans-serif'; cx.fillText('To. 最愛的粉絲 ♡',12,22);
      cx.strokeStyle='#eadcf5'; cx.lineWidth=2; cx.beginPath(); cx.moveTo(14,H-28); cx.lineTo(W-14,H-28); cx.stroke();
      if(ghost){ cx.strokeStyle='rgba(190,160,220,.45)'; cx.lineWidth=7; cx.lineCap='round'; cx.lineJoin='round';
        ghost.forEach(st=>{ cx.beginPath(); st.forEach(([x,y],i)=> i?cx.lineTo(x*W,y*H):cx.moveTo(x*W,y*H)); cx.stroke(); }); } };
    paper();
    const t0=performance.now();
    const finish=()=>{
      const el=(performance.now()-t0)/1000;
      let perf, note='';
      if(ghost){
        const sim=sigSimilarity(ghost,strokes,W,H), speed=clamp(1-el/A.limit);
        perf=0.65*sim+0.35*speed;
        note=`相似度 ${Math.round(sim*100)}%・${el.toFixed(1)} 秒`;
      } else perf=clamp(len/(W*2.2));
      SIG.ghost=strokes.filter(st=>st.length>1);   // 這次的簽名變成下一次的範本
      award('sign',perf,null,note);
    };
    actTimer(A.limit,()=> len>=40 ? finish() : fail('沒簽到名，粉絲哭哭'));
    const pos=e=>{ const r=cv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; };
    cv.onpointerdown=e=>{ if(G.act.done) return; drawing=true; cv.setPointerCapture(e.pointerId); [lx,ly]=pos(e); cur=[[lx/W,ly/H]]; strokes.push(cur); };
    cv.onpointermove=e=>{ if(!drawing||G.act.done) return; const [x,y]=pos(e);
      cx.strokeStyle='#2b1d3a'; cx.lineWidth=3.5; cx.lineCap='round'; cx.lineJoin='round';
      cx.beginPath(); cx.moveTo(lx,ly); cx.lineTo(x,y); cx.stroke(); len+=Math.hypot(x-lx,y-ly); lx=x; ly=y; cur.push([x/W,y/H]); $('sigOk').disabled=len<40; };
    cv.onpointerup=cv.onpointercancel=()=>drawing=false;
    $('sigClr').onclick=()=>{ if(G.act.done) return; len=0; strokes=[]; paper(); $('sigOk').disabled=true; };
    $('sigOk').onclick=()=>{ if(G.act.done) return; finish(); };
  },

  heart(A,bp){
    const types=[['🫰','手指愛心'],['🫶','雙手大愛心'],['☺️💗','臉頰愛心']];
    setPanel(`${A.icon} ${A.name}`,`<div class="hint">愛心滑進圈圈的瞬間按「比心！」抓準節拍 💗</div>
      <div class="track" id="trk"><div class="zone"></div><div id="notes"></div><div class="judge" id="judge"></div></div>
      <button class="go hitbtn" id="hit">💗 比心！</button>`,bp);
    const trk=$('trk'), W=trk.clientWidth, zoneX=W*0.18, speed=W*0.55;
    const t0=performance.now()/1000;
    const notes=[1.3,2.45,3.6].map(t=>({t:t+(Math.random()-.5)*0.25, type:pickA(types), res:null}));
    notes.forEach(n=>{ n.el=document.createElement('div'); n.el.className='note'; n.el.textContent=n.type[0]; $('notes').appendChild(n.el); });
    let perfect=0, good=0, over=false;
    const judge=(txt,cls)=>{ const j=$('judge'); j.textContent=txt; j.className='judge '+cls; void j.offsetWidth; j.classList.add('show'); };
    const end=()=>{ if(over) return; over=true;
      if(!perfect&&!good) return fail('節拍全部 miss，粉絲好尷尬');
      award('heart',(perfect+good*0.6)/notes.length,null,`Perfect ${perfect}・Good ${good}`); };
    actTimer(A.limit,end);
    const frame=()=>{
      if(over||G.act.done) return;
      const now=performance.now()/1000-t0;
      notes.forEach(n=>{ if(n.res) return; const x=zoneX+(n.t-now)*speed;
        n.el.style.transform=`translateX(${x}px)`; n.el.style.opacity=x>W+24?0:1;
        if(now-n.t>0.22){ n.res='miss'; n.el.classList.add('miss'); judge('MISS','miss'); } });
      if(notes.every(n=>n.res)) return setTimeout(end,250);
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
    $('hit').onpointerdown=e=>{ e.preventDefault(); if(over||G.act.done) return;
      const now=performance.now()/1000-t0;
      const n=notes.filter(n=>!n.res).sort((a,b)=>Math.abs(a.t-now)-Math.abs(b.t-now))[0]; if(!n) return;
      const d=Math.abs(n.t-now);
      if(d<=0.09){ n.res='perfect'; perfect++; judge('PERFECT!','pf'); }
      else if(d<=0.2){ n.res='good'; good++; judge('GOOD','gd'); }
      else if(d<=0.45){ n.res='miss'; n.el.classList.add('miss'); judge(now<n.t?'太早了！':'太慢了！','miss'); return; } // 亂按會被判 miss
      else return;
      n.el.classList.add('hit'); gesture(n.type[0]); hearts(n.res==='perfect'?6:3); loveRandom(1);
    };
  },

/* --- 秘密危機：每局 2 次，玩法不重複；搭配狗仔快門特效 --- */
const CRISIS_LIMIT=6;
const CRISIS_NAME={choice:'圓場',mash:'狂點',catch:'搶救'};
function runCrisis(type){
  const g=G; G.crisisIdx++; G.act={done:true};
  paparazzi(true);
  overlay(['📸 狗仔出沒！'],900,()=>{ if(G===g && G.running) crisisPanel(type); });
}
function crisisPanel(type){
  const S=G.sec, ev=S.ev[type], idol=G.idol;
  const title=`🚨 秘密危機 ${G.crisisIdx}/2<span class="bonus" style="background:#ff3b3b">爆雷指數 ${'💣'.repeat(S.r)}</span>`;
  const scene=`<div class="crisis-scene">${fmt(ev.scene,idol)}</div>`;
  const done=o=>resolveCrisis(type,o);
  if(type==='choice'){
    const opts=[...ev.opts].sort(()=>Math.random()-.5);
    setPanel(title, scene+`<div class="copts">${opts.map(o=>`<button data-o="${o[1]}">${esc(fmt(o[0],idol))}</button>`).join('')}</div>`);
    actTimer(CRISIS_LIMIT,()=>resolveCrisis(type,'bad','愣住太久，被狗仔拍到了'));
    $('panel').querySelectorAll('.copts button').forEach(b=>b.onclick=()=>{ if(!G.act.done) done(b.dataset.o); });
  } else if(type==='mash'){
    // 5 秒內點越多下分數越高；低於 15 下不給分而且現場大亂
    let c=0; const MIN=15, LIM=5, FULL=35;
    setPanel(title, scene+`<button class="mash" id="mash"><span class="em">${ev.icon}</span>${ev.btn}<div class="cnt"><b id="mcnt">0</b> 下（至少 ${MIN} 下）</div><div class="mbar"><i id="mbar"></i><span class="mmin" style="left:${MIN/FULL*100}%"></span></div></button>`);
    actTimer(LIM,()=>{
      if(c<MIN) resolveCrisis(type,'chaos',null,{pts:0,msg:`只點了 ${c} 下…現場大亂！`});
      else resolveCrisis(type, c>=30?'best':'good', null, {pts:Math.min(25,5+(c-MIN)), msg:`狂點 ${c} 下，危機化解！${c>=30?'💯':''}`});
    });
    $('mash').onpointerdown=e=>{ e.preventDefault(); if(G.act.done) return; c++; $('mcnt').textContent=c;
      const bar=$('mbar'); bar.style.width=Math.min(100,c/FULL*100)+'%'; bar.classList.toggle('ok',c>=MIN);
      $('mash').style.transform=`scale(${0.96+Math.random()*0.06}) rotate(${(Math.random()-.5)*4}deg)`; };
  } else {
    let c=0;
    setPanel(title, scene+`<div class="hint" style="font-size:15px">快點掉舞台上的 ${ev.icon}！ <b id="ccnt">0 / ${ev.n}</b></div>`);
    actTimer(CRISIS_LIMIT,()=>done(c>=ev.n/2?'ok':'bad'));
    for(let i=0;i<ev.n;i++){
      const d=document.createElement('div'); d.className='catchme'; d.textContent=ev.icon;
      d.style.cssText=`left:${8+Math.random()*72}%;top:${8+Math.random()*60}%;--mx:${(Math.random()-.5)*90}px;--my:${(Math.random()-.5)*50}px;animation-duration:${0.8+Math.random()*0.8}s`;
      d.onpointerdown=e=>{ e.preventDefault(); if(G.act.done) return; d.remove(); c++; $('ccnt').textContent=`${c} / ${ev.n}`; if(c>=ev.n) done('best'); };
      $('crowd').appendChild(d);
    }
  }
  $('panel').classList.add('alert');
}
function resolveCrisis(type,o,why,custom){
  G.act.done=true; paparazzi(false);
  document.querySelectorAll('.catchme').forEach(e=>e.remove());
  const r=G.sec.r; let pts,msg,color;
  if(custom){ pts=custom.pts; msg=custom.msg;
    if(o==='chaos'){ color='#ff7b7b'; chaos(); } else { color='#ffd36e'; hearts(o==='best'?14:8); loveRandom(3); } }
  else if(o==='best'){ pts=rint(10,20); msg='危機化解！反差萌爆棚 💗'; color='#ffd36e'; hearts(12); loveRandom(4); }
  else if(o==='ok'){ pts=-r*2; msg='勉強過關…粉絲有點疑惑 🤔'; color='#fff'; }
  else { pts=-r*rint(5,8); msg=`${why?why+'！<br>':''}爆雷上熱搜 #${esc(G.name)}出事了 🔥`; color='#ff7b7b'; hearts(10,['💔','🔥','📸']); shutter(3); }
  G.score=Math.max(0,G.score+pts); G.crises.push({type,o,pts}); scoreUI();
  pop(`${msg}<div style="font-size:30px">${pts>0?'+':''}${pts}</div>`,crowdMid(),17,color);
  later(nextAction,o==='chaos'?1800:1400);
}

/* --- 狗仔特效：閃光燈、快門聲、獨家跑馬燈、紅色警戒 --- */
let AC=null;
function enableAudio(){ try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){} }
function shutter(n=1){
  if(!AC) return;
  for(let i=0;i<n;i++){
    const t=AC.currentTime+i*0.09, len=0.06, buf=AC.createBuffer(1,AC.sampleRate*len,AC.sampleRate), d=buf.getChannelData(0);
    for(let j=0;j<d.length;j++) d[j]=(Math.random()*2-1)*Math.pow(1-j/d.length,3);
    const src=AC.createBufferSource(), g=AC.createGain(), f=AC.createBiquadFilter();
    f.type='highpass'; f.frequency.value=1800; g.gain.value=0.35;
    src.buffer=buf; src.connect(f).connect(g).connect(AC.destination); src.start(t);
  }
}
let papaTimer=null;
function paparazzi(on){
  const st=$('stage'); clearTimeout(papaTimer);
  st.querySelectorAll('.breaking,.reddim').forEach(e=>e.remove());
  st.classList.toggle('shake',on);
  if(!on) return;
  try{ navigator.vibrate&&navigator.vibrate([80,60,80]); }catch(e){}
  st.insertAdjacentHTML('beforeend',`<div class="reddim"></div><div class="breaking"><span>🔴 LIVE 獨家直擊｜${esc(G.name)} 疑似有不可告人的秘密？！記者已在現場…　📸 快門聲不斷　🔴 LIVE 獨家直擊｜${esc(G.name)} 驚爆內幕？！</span></div>`);
  const burst=()=>{
    if(!G||!G.running||!st.classList.contains('shake')) return;
    const c=$('crowd'), f=document.createElement('div'); f.className='pflash';
    const side=Math.random()<.5; // 記者多半在兩側
    f.style.left=(side?Math.random()*28:72+Math.random()*28)+'%'; f.style.top=(c.offsetTop+Math.random()*c.offsetHeight*0.8)+'px';
    f.innerHTML='<span>📸</span>'; st.appendChild(f); setTimeout(()=>f.remove(),450);
    if(Math.random()<.6) shutter(Math.random()<.3?2:1);
    papaTimer=setTimeout(burst,160+Math.random()*260);
  };
  burst();
}

/* --- 手機水平儀（DeviceMotion；不支援時自拍用滑桿） --- */
const TILT={on:false,v:0,flat:false,listening:false};
function onMotion(e){
  const a=e.accelerationIncludingGravity; if(!a||a.x==null||a.y==null) return;
  let x=a.x, y=a.y;
  if(Math.hypot(x,y)<3){ TILT.flat=true; TILT.on=true; return; }
  TILT.flat=false;
  if(y<0){ x=-x; y=-y; }               // iOS 的軸向與 Android 相反
  const ang=Math.atan2(-x,y)*180/Math.PI; // 手機順時針轉為正
  TILT.v = TILT.on ? TILT.v*0.75+ang*0.25 : ang; TILT.on=true;
}
function enableMotion(){
  if(TILT.listening) return;
  try{
    if(typeof DeviceMotionEvent!=='undefined' && typeof DeviceMotionEvent.requestPermission==='function'){
      DeviceMotionEvent.requestPermission().then(s=>{ if(s==='granted'){ TILT.listening=true; addEventListener('devicemotion',onMotion); } }).catch(()=>{});
    } else if(typeof DeviceMotionEvent!=='undefined'){ TILT.listening=true; addEventListener('devicemotion',onMotion); }
  }catch(e){}
}

function endStage(){
  G.running=false; if(G.act) G.act.done=true; paparazzi(false); document.querySelectorAll('.catchme').forEach(e=>e.remove());
  const g=G;
  overlay(['時間到！'],1300,()=>{ if(G===g) showResult(); });
}
function showResult(){
  const g=G, male=g.idol.gender==='男';
  const tiers=[[280,male?'國民天王':'國民天后','全台灣都在喊你的名字！'],[200,'頂流巨星','熱搜第一掛整晚'],[130,'人氣偶像','應援棒亮成一片海'],[60,'新人偶像','開始有人認得你了'],[0,'地下偶像','台下最大聲的是你媽']];
  const t=tiers.find(x=>g.score>=x[0]);
  let rows=Object.keys(ACTIONS).map(k=>{ const [n,p]=g.stats[k]; return `<tr><td>${ACTIONS[k].icon} ${ACTIONS[k].name}</td><td>${n} 次</td><td>${k==='kiss'?'加成用':(p>=0?'+':'')+p}</td></tr>`; }).join('');
  const cName={best:'完美化解',good:'化解',ok:'勉強過關',bad:'爆雷',chaos:'現場大亂'};
  g.crises.forEach((c,i)=>{ rows+=`<tr><td>🚨 秘密危機 ${i+1}（${CRISIS_NAME[c.type]}）</td><td>${cName[c.o]}</td><td style="color:${c.pts<0?'#e0405a':'inherit'}">${c.pts>0?'+':''}${c.pts}</td></tr>`; });
  const secT=esc(fmt(g.sec.t,g.idol)), outs=g.crises.map(c=>c.o);
  const phew= outs.includes('bad') ? `🔥 明天頭條：${secT}` : outs.some(o=>o==='ok'||o==='chaos') ? `😅 差一點就穿幫了：${secT}` : `🤫 幸好今天沒人發現：${secT}`;
  $('result').innerHTML=`
    <div class="mini">${g.idol.photo?`<img src="${g.idol.photo}" alt="">`:avatarSVG(g.idol)}</div>
    <div class="rname">${esc(g.name)}</div>
    <div class="rtier">${t[1]}</div><div class="rsub">${t[2]}</div>
    <div class="total">💗 ${g.score}<small>總好感度</small></div>
    <table class="rt">${rows}</table>
    <div class="phew">${phew}</div>
    <div class="btns"><button class="reroll" id="again">🔁 再飯撒一場</button><button class="debut" id="redraw">🎲 重新抽卡</button></div>`;
  $('again').onclick=()=>{ enableMotion(); enableAudio(); startStage(); };
  $('redraw').onclick=()=>{ G=null; showScreen('scr-card'); draw(); };
  showScreen('scr-result');
}

draw();
</script>
